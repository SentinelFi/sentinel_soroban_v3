[workspace]
resolver = "2"
members = [
    "sentinel_types",
    "mock_usdc",
    "governance_module",
    "risk_vault",
    "oracle_aggregator",
    "flight_pool_manager",
    "controller",
    "integration_tests",
]
exclude = ["target", "risk_vault/fuzz", "oracle_aggregator/fuzz"]

[workspace.package]
authors = ["SentinelFi"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SentinelFi/sentinel_soroban_v3"
version = "1.0.0"

[workspace.dependencies]
soroban-sdk = "25.3.1"
stellar-tokens = "0.7.1"
stellar-access = "0.7.1"
stellar-macros = "0.7.1"
stellar-contract-utils = "0.7.1"
# Property-based testing (dev-dependency only — never part of contract wasm).
proptest = "1"

[workspace.lints.clippy]
# 7-decimal asset literals look like `10_0000000` — the grouping is
# convention, not a typo. Same for the underlying-token-decimals constant.
inconsistent_digit_grouping = "allow"
unreadable_literal = "allow"
# Soroban contract entry points often need 7-10 params (env + auth-related
# Address + per-call params). Splitting them solely to satisfy clippy hurts
# readability of the public API.
too_many_arguments = "allow"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
