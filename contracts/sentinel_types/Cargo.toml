[package]
name = "sentinel_types"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[features]
# `testutils` re-exposes the shared test helpers (ContractEvents decoder)
# behind a feature flag so production builds of dependent contracts don't
# pull in soroban-sdk's testutils. Each contract opts in via dev-dependencies.
testutils = ["soroban-sdk/testutils"]

[lints]
workspace = true
