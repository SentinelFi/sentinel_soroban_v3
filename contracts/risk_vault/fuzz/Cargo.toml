[package]
name = "risk_vault-fuzz"
version = "0.0.0"
description = "Fuzz harness for RiskVault solvency and share-accounting invariants"
publish = false
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SentinelFi/sentinel_soroban_v3"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
risk_vault = { path = ".." }
soroban-sdk = { version = "25.3.1", features = ["testutils"] }

[[bin]]
name = "solvency"
path = "fuzz_targets/solvency.rs"
test = false
doc = false
bench = false

[workspace]
