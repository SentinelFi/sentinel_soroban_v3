[package]
name = "flight_pool_manager"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-access = { workspace = true }
stellar-macros = { workspace = true }
stellar-contract-utils = { workspace = true }
sentinel_types = { path = "../sentinel_types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sentinel_types = { path = "../sentinel_types", features = ["testutils"] }
mock_usdc = { path = "../mock_usdc" }
risk_vault = { path = "../risk_vault" }

[package.metadata.stellar]
cargo_inherit = true

[lints]
workspace = true
