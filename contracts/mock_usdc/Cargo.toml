[package]
name = "mock_usdc"
version = "0.0.0"
description = "Testnet-only mock USDC fungible token with permissionless mint and faucet; never deployed to mainnet"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

# Audit ASF-03: permissionless mint/faucet are gated behind this default-on
# feature. Normal testnet builds (`cargo build`, `stellar contract build`) keep
# them; a production build must opt out with `--no-default-features`, turning an
# accidental mainnet deployment of a permissionless-mint token into a deliberate
# act. Production should use the real USDC Stellar Asset Contract regardless.
[features]
default = ["testnet"]
testnet = []

[dependencies]
soroban-sdk = { workspace = true }
stellar-tokens = { workspace = true }
stellar-access = { workspace = true }
stellar-macros = { workspace = true }
sentinel_types = { path = "../sentinel_types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[package.metadata.stellar]
cargo_inherit = true

[lints]
workspace = true
