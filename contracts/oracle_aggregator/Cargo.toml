[package]
name = "oracle_aggregator"
version = "0.0.0"
description = "Authoritative flight-status registry enforcing a forward-only settlement state machine"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-access = { workspace = true }
stellar-macros = { workspace = true }
stellar-contract-utils = { workspace = true }
sentinel_types = { path = "../sentinel_types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sentinel_types = { path = "../sentinel_types", features = ["testutils"] }

[package.metadata.stellar]
cargo_inherit = true

[lints]
workspace = true
