name: CI

on:
  pull_request:

# Cancel in-progress runs for the same PR when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: test, build, lint, audit
    runs-on: ubuntu-latest
    # The Cargo workspace, Makefile, and rust-toolchain.toml all live in
    # `contracts/`. Running every step from there lets rustup auto-install the
    # pinned toolchain (1.94.0 + wasm32v1-none target + clippy/rustfmt) from
    # rust-toolchain.toml.
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        # Triggers rustup to install the toolchain, target, and components
        # declared in contracts/rust-toolchain.toml.
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
          cache-bin: "false"

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install native build dependencies
        # cargo-binstall falls back to building from source when no prebuilt
        # binary is published for a crate/version. stellar-cli's source build
        # needs the D-Bus and udev C headers (keyring/HID dependencies), which
        # the GitHub runner image doesn't include.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev

      - name: Install stellar-cli, cargo-audit, and cargo-llvm-cov
        # --locked matters for binstall's build-from-source FALLBACK (taken
        # whenever a fresh crate release has no prebuilt binary yet): an
        # unlocked build resolves the newest deps, which can demand a newer
        # rustc than the pinned toolchain (seen: cargo-audit 0.22.2 pulling
        # a kstring that wants 1.96 on our 1.94). The crate's committed
        # lockfile builds with the versions its authors actually tested.
        run: cargo binstall -y --locked stellar-cli cargo-audit cargo-llvm-cov

      - name: cargo test with coverage
        # Runs the suite and writes a browsable HTML report to target/llvm-cov/html.
        run: cargo llvm-cov test --html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: contracts/target/llvm-cov/html
          if-no-files-found: error

      - name: stellar contract build
        run: stellar contract build

      - name: Check contract wasm sizes
        # Soroban enforces a hard per-contract code-size cap at upload time;
        # catching a breach (or creep toward it) here keeps size regressions a
        # red PR instead of a failed deploy. Prints a table into the job
        # summary; fails if any contract exceeds the cap.
        run: bash scripts/check_wasm_size.sh

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo audit
        run: cargo audit

  dapp:
    name: dapp lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: dapp/.nvmrc
          cache: npm
          cache-dependency-path: dapp/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Build contract binding packages
        run: npm run install:contracts

      - name: oxlint
        run: npm run lint

      - name: Typecheck (src + api/scripts/config + vite.config)
        run: npm run typecheck

      - name: vite build
        run: npx vite build

  landing:
    name: landing typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: landing/.nvmrc
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (client + SSR + prerender)
        # npm run build chains tsc, the client build, the SSR entry build,
        # and scripts/prerender.mjs — the prerender inject is the step that
        # would otherwise break silently.
        run: npm run build

      - name: Verify prerendered HTML
        # The prerender script must have replaced the empty root with real
        # markup and injected the FAQPage JSON-LD.
        run: |
          grep -q 'Parametric flight insurance' dist/index.html
          grep -q 'FAQPage' dist/index.html
          if grep -q '<div id="root"></div>' dist/index.html; then
            echo 'dist/index.html still has an empty #root — prerender did not run'
            exit 1
          fi
