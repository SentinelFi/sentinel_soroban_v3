services:
  # Python ML prediction service — the one piece that cannot live in Vercel
  # (xgboost + sklearn + pandas exceed serverless size limits). Everything
  # else (frontend + all crons) deploys as the single Vercel project in
  # dapp/. Pure prediction API (POST /predict) — all premium/payout math
  # lives in the dapp (route_rules.ts).
  - type: web
    name: flight-delay-predictions
    runtime: python
    rootDir: agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AGENT_TOKEN
        sync: false
